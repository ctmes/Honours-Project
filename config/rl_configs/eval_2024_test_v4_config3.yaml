# ============================================================================
# v4 EXPLORATORY EVAL CONFIG - v4_config3_full on the HELD-OUT 2024_test split.
# Generated from eval_2024_test_config3.yaml; identical except ENV_CONFIG and PROJECT.
#
# ENV_CONFIG MUST be the v4 (spread_skew) env: a v4 checkpoint's action head is
# 6-way over a 2x3 spread x skew grid, and restoring it against a bobRL env
# mismatches the head. That is the failure this file exists to prevent.
#
# Common adversary is v4_config3_full, NOT v3_config3_full: the pre-registered
# design is "config-3's adversary, paired by seed index", applied within the
# version under evaluation. The v3 adversary never trained against a
# price-setting market maker.
#
# VALIDITY: do NOT cite quote_presence for v4. spread_skew posts on both sides
# every step, so it reads 1.0 unless the book is empty or the position limit is
# liquidating. Argue validity from inventory_sd, peak_inventory and within-
# episode reward drift instead.
#
# NOT CONFIRMATORY. preregistration.json -> amendments -> v4_spread_skew_amendment.
# The confirmatory result of record remains v3 (eval 1179095).
# ============================================================================

# ============================================================================
# EVAL CONFIG — Config-3 (full model) checkpoints on the HELD-OUT 2024_test
# split. ENV_CONFIG matches the arm's training json (detection + regime obs
# channels ACTIVE); attack modes forced by set_attack_mode at eval time.
# The regime obs channel needs REGIME_LABELS_PATH + the TEST window map below,
# or H4 is silently disabled at evaluation.
#
# Used via:  evaluate_seeds(project="v3_config3_full",
#                           run_names=["seed_0", ...],
#                           yaml_path="config/rl_configs/eval_2024_test_config3.yaml",
#                           adv_project="v3_config3_full",
#                           adv_run_names=["seed_0", ...])   # self = reference
# ============================================================================

