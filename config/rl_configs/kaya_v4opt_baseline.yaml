# WS10a LEARNED OPTIMAL ATTACK on the frozen v4 'baseline' market maker. EXPLORATORY.
# Generated by make_tier4_configs.py from kaya_v4_config1_baseline.yaml.
# Env = config/env_configs/adversarial_mm_v4_config2.json (the arm's eval env) + cost-free, always-on, 1e7-budget,
# victim-observing adversary. ANNEAL_TOTAL_UPDATES = 2 x updates because the
# schedule halves it for alternating freezes, and here the adversary updates every step.
#
#   sbatch --time=12:00:00 --array=0-19%10 slurm_cpu_sweep.sh kaya_v4opt_baseline TOTAL_TIMESTEPS=4096000
#
# ============================================================================
# v4 PILOT arm A - spread_skew action space. Identical to
# kaya_config1_baseline.yaml except ENV_CONFIG and PROJECT.
#
# Smoke test first (2 updates, throwaway PROJECT, ~2 min):
#   sbatch --array=0-0 slurm_cpu_sweep.sh kaya_v4_config1_baseline \n#          TOTAL_TIMESTEPS=16384 PROJECT=smoke_v4
# ============================================================================

# List-valued params are per-agent-type: index 0 = AdversarialMM, index 1 = Spoofing
"LR": [0.0003, 0.0003]
"NUM_ENVS": 16
"NUM_STEPS": 512
"GRU_HIDDEN_DIM": 256          # dummy hidden dim for MLP pass-through carry
"FC_DIM_SIZE": 256
"TOTAL_TIMESTEPS": 2736128     # PHASE 1 (Q1) budget: 334 updates; q2/q3 phases override
"ANNEAL_TOTAL_UPDATES": 1000
"UPDATE_EPOCHS": 4
"NUM_MINIBATCHES": 4
"GAMMA": [0.999, 0.99]         # MM 0.999 (validated 2026-06-26 stability run); ADV 0.99
"GAE_LAMBDA": [0.85, 0.95]
"CLIP_EPS": 0.2
"SCALE_CLIP_EPS": [false, false]
"ENT_COEF": [0.01, 0.01]
"VF_COEF": [0.5, 0.5]
"MAX_GRAD_NORM": [0.5, 0.5]
"ANNEAL_LR": [true, true]
"NUM_AGENTS_PER_TYPE": [1, 1]
"SEED": 42                     # overridden per job: SEED=${SLURM_ARRAY_TASK_ID}

# Adversarial-specific (detection/PCGrad inert in this arm: use_detection_head
# is false in the env config, so the BCE branch is skipped entirely)
"FREEZE_ALTERNATION": 10
"DETECTION_LOSS_COEF": 0.5
"PCGRAD_ENABLED": true
"NORMALIZE_REWARDS": true
"CHECKPOINT_EVERY": 50
# Regime labels are loaded for logging/eval splits in every arm; the MM's
# regime obs channel is only active in config 3 (regime_conditioning flag).
"REGIME_LABELS_PATH": "regime_labels.json"
"WINDOW_TO_DATE_PATH": "window_to_date_2024_q1.json"   # phase 1; overridden per phase

"ENV_CONFIG": "config/env_configs/adversarial_mm_v4opt_baseline.json"

"TimePeriod": "2024_q1"        # phase 1; slurm_sweep.sh overrides for q2/q3

"ENTITY": "your-wandb-entity"
"PROJECT": "v4opt_baseline"
"WANDB_MODE": "disabled"

# WS10a switches (ippo_adversarial.py): the MM is loaded from the trained v4
# arm and never updated; every update trains the adversary.
"FREEZE_MM": true
"MM_INIT_FROM": "v4_config1_baseline/seed_{SEED}@1002"
